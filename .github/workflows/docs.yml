name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Install latest mdBook
        # No pinned version: always install the latest mdBook release, and
        # fall back to building the latest release from crates.io.
        run: |
          set -euo pipefail
          version="$(curl -fsSL https://api.github.com/repos/rust-lang/mdBook/releases/latest \
            | jq -r '.tag_name' | sed 's/^v//' || true)"
          url="https://github.com/rust-lang/mdBook/releases/download/v${version}/mdbook-v${version}-x86_64-unknown-linux-gnu.tar.gz"
          if [ -n "$version" ] && [ "$version" != "null" ] && curl -fsSL -o mdbook.tar.gz "$url"; then
            tar -xzf mdbook.tar.gz mdbook
            sudo install -m 0755 mdbook /usr/local/bin/mdbook
            rm -f mdbook.tar.gz mdbook
          else
            cargo install mdbook
          fi
          mdbook --version

      - name: Build English book
        run: mdbook build -d "${GITHUB_WORKSPACE}/_site/english" docs/english

      - name: Build Chinese book
        run: mdbook build -d "${GITHUB_WORKSPACE}/_site/chinese" docs/chinese

      - name: Add landing page
        run: cp docs/index.html _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
